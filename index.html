<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cipher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1F1F24;
    --field: #42445a;
    --field-focus: #4b4d66;
    --text: #f5f4f0;
    --text-dim: #b8b8c4;
    --accent: #e7a256;
    --error: #e2897a;
    --ok: #9ecb8f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 64px 24px;
  }

  .wrap { width: 100%; max-width: 460px; }

  .mode-switch {
    display: flex;
    gap: 28px;
    margin-bottom: 44px;
  }

  .mode-switch button {
    background: none;
    border: none;
    padding: 0 0 6px;
    font-family: inherit;
    font-size: 22px;
    font-weight: 700;
    color: var(--text-dim);
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: color 0.2s ease, border-color 0.25s ease;
  }

  .mode-switch button.active {
    color: var(--text);
    border-bottom-color: var(--accent);
  }

  label {
    display: block;
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 14px;
  }

  .field { margin-bottom: 36px; }

  textarea, input[type="text"] {
    width: 100%;
    background: var(--field);
    border: none;
    border-radius: 14px;
    color: var(--text);
    padding: 18px 20px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 16px;
    resize: none;
    outline: none;
    transition: background 0.25s ease, box-shadow 0.25s ease;
  }

  textarea::placeholder, input::placeholder { color: var(--text-dim); }

  textarea { min-height: 100px; line-height: 1.5; }
  input[type="text"] { height: 62px; }

  textarea:focus, input:focus {
    background: var(--field-focus);
    box-shadow: 0 0 0 2px var(--accent) inset;
  }

  input[type="color"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 62px;
    border: none;
    border-radius: 14px;
    background: var(--field);
    padding: 0;
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  input[type="color"]::-webkit-color-swatch-wrapper { padding: 8px; }
  input[type="color"]::-webkit-color-swatch { border: none; border-radius: 8px; transition: background 0.1s ease; }
  input[type="color"]::-moz-color-swatch { border: none; border-radius: 8px; }
  input[type="color"]:active { transform: scale(0.98); }

  /* password + hex grouped as one unit */
  .password-group {
    border: 2px solid var(--field);
    border-radius: 20px;
    padding: 24px 24px 4px;
    margin-bottom: 36px;
  }

  .password-group .field,
  .password-group .collapsible.open {
    margin-bottom: 28px;
  }

  /* custom checkbox */
  .checkbox-field { margin-bottom: 24px; }

  .checkbox-label {
    display: flex;
    align-items: center;
    cursor: pointer;
    margin-bottom: 0;
  }

  .checkbox-label input[type="checkbox"] {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
  }

  .checkbox-box {
    width: 26px;
    height: 26px;
    border-radius: 8px;
    background: var(--field);
    border: 2px solid var(--field);
    flex-shrink: 0;
    margin-right: 14px;
    position: relative;
    transition: background 0.25s ease, border-color 0.25s ease, transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .checkbox-label:active .checkbox-box {
    transform: scale(0.88);
  }

  .checkbox-box::after {
    content: '';
    position: absolute;
    left: 8px;
    top: 3px;
    width: 6px;
    height: 12px;
    border: solid #2a1d0c;
    border-width: 0 3px 3px 0;
    transform: rotate(45deg) scale(0);
    opacity: 0;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.15s ease;
    transition-delay: 0.05s;
  }

  .checkbox-label input[type="checkbox"]:checked + .checkbox-box {
    background: var(--accent);
    border-color: var(--accent);
    transform: scale(1.08);
  }

  .checkbox-label input[type="checkbox"]:checked + .checkbox-box::after {
    opacity: 1;
    transform: rotate(45deg) scale(1);
  }

  .checkbox-text {
    font-size: 18px;
    font-weight: 700;
  }

  /* algorithm switch (+ / x), lives inside a collapsible tied to hexToggle */
  .algo-inner {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .algo-inner .line {
    flex: 1;
    height: 1px;
    background: var(--field);
  }

  .algo-switch {
    display: flex;
    gap: 4px;
    background: var(--bg);
    border-radius: 12px;
    padding: 4px;
    flex-shrink: 0;
  }

  .algo-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 17px;
    font-weight: 700;
    padding: 8px 16px;
    border-radius: 9px;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .algo-btn.active {
    background: var(--accent);
    color: #2a1d0c;
  }

  /* collapsible sections (color/hex fields, algo switch, result) */
  .collapsible {
    display: grid;
    grid-template-rows: 0fr;
    opacity: 0;
    margin-bottom: 0;
    transition: grid-template-rows 0.35s ease, opacity 0.25s ease, margin-bottom 0.35s ease;
  }

  .collapsible.open {
    grid-template-rows: 1fr;
    opacity: 1;
    margin-bottom: 36px;
  }

  .collapsible > .collapsible-inner {
    overflow: hidden;
    min-height: 0;
  }

  button.go {
    width: 100%;
    background: var(--accent);
    color: #2a1d0c;
    border: none;
    border-radius: 14px;
    padding: 18px;
    font-family: inherit;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 14px;
    transition: opacity 0.2s ease, transform 0.15s ease;
  }

  button.go:hover { opacity: 0.92; }
  button.go:active { opacity: 0.8; transform: scale(0.98); }

  .formula {
    font-family: ui-monospace, 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
    background: var(--field);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 14px;
    line-height: 1.5;
    word-break: break-word;
  }

  .formula .key-term {
    color: var(--accent);
  }

  .formula .time-inline {
    color: var(--text-dim);
    font-size: 11px;
  }

  .status {
    font-size: 14px;
    min-height: 18px;
    margin-bottom: 6px;
    transition: color 0.2s ease;
  }
  .status.error { color: var(--error); }
  .status.ok { color: var(--ok); }

  .result textarea {
    background: transparent;
    border: 2px solid var(--field);
    color: var(--text);
    transition: border-color 0.25s ease;
  }

  .copy-link {
    background: none;
    border: none;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    padding: 0;
    text-decoration: underline;
    text-underline-offset: 3px;
    transition: color 0.2s ease;
  }
  .copy-link:hover { color: var(--text); }

  /* time precision select */
  select {
    width: 100%;
    background: var(--field);
    border: none;
    border-radius: 14px;
    color: var(--text);
    padding: 16px 20px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    outline: none;
    cursor: pointer;
    transition: background 0.25s ease, box-shadow 0.25s ease;
  }
  select:focus {
    background: var(--field-focus);
    box-shadow: 0 0 0 2px var(--accent) inset;
  }
  select option { background: var(--bg); color: var(--text); }

  .time-preview {
    margin-top: 10px;
    font-size: 13px;
    color: var(--text-dim);
    font-family: ui-monospace, 'JetBrains Mono', monospace;
  }

  .time-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 10px;
  }

  .time-row .time-preview { margin-top: 0; }

  .note {
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.6;
    margin-top: 56px;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="mode-switch">
    <button id="btnEncode" class="active" onclick="switchMode('encode')">encode</button>
    <button id="btnDecode" onclick="switchMode('decode')">decode</button>
  </div>

  <div class="field">
    <label id="labelText" for="textInput">text</label>
    <textarea id="textInput" placeholder="type anything"></textarea>
  </div>

  <div class="password-group">

    <div class="checkbox-field">
      <label class="checkbox-label">
        <input type="checkbox" id="passToggle" checked onchange="togglePass()">
        <span class="checkbox-box"></span>
        <span class="checkbox-text">include password?</span>
      </label>
    </div>

    <div class="collapsible open" id="passField">
      <div class="collapsible-inner">
        <label for="pwInput">password</label>
        <input type="text" id="pwInput" placeholder="passphrase">
      </div>
    </div>

    <div class="checkbox-field">
      <label class="checkbox-label">
        <input type="checkbox" id="hexToggle" onchange="toggleHex()">
        <span class="checkbox-box"></span>
        <span class="checkbox-text">include hex?</span>
      </label>
    </div>

    <div class="collapsible" id="colorField">
      <div class="collapsible-inner">
        <label for="colorPicker">color</label>
        <input type="color" id="colorPicker" value="#e7a256">
      </div>
    </div>

    <div class="collapsible" id="hexField">
      <div class="collapsible-inner">
        <label for="hexInput">hex code</label>
        <input type="text" id="hexInput" placeholder="#e7a256" value="#e7a256">
      </div>
    </div>

    <div class="checkbox-field">
      <label class="checkbox-label">
        <input type="checkbox" id="timeToggle" onchange="toggleTime()">
        <span class="checkbox-box"></span>
        <span class="checkbox-text">include time?</span>
      </label>
    </div>

    <div class="collapsible" id="timeField">
      <div class="collapsible-inner">
        <label for="timePrecision">precision</label>
        <select id="timePrecision">
          <option value="second">second</option>
          <option value="minute">minute</option>
          <option value="hour">hour</option>
          <option value="day">day</option>
          <option value="month">month</option>
          <option value="year">year</option>
        </select>
        <div class="time-preview" id="timePreview"></div>
      </div>
    </div>

    <div class="collapsible" id="timeManualField">
      <div class="collapsible-inner">
        <label for="timeManualInput">time value</label>
        <input type="text" id="timeManualInput" placeholder="e.g. 20260907123456">
        <div class="time-row">
          <div class="time-preview" id="timeNow"></div>
          <button class="copy-link" onclick="fillNow()">now</button>
        </div>
      </div>
    </div>

    <div class="collapsible" id="algoWrap">
      <div class="collapsible-inner algo-inner">
        <div class="line"></div>
        <div class="algo-switch">
          <button type="button" class="algo-btn active" id="algoAdd" onclick="setAlgo('add')">+</button>
          <button type="button" class="algo-btn" id="algoMul" onclick="setAlgo('multiply')">&times;</button>
        </div>
        <div class="line"></div>
      </div>
    </div>

  </div>

  <button class="go" onclick="run()" id="goBtn">encode</button>
  <div class="formula" id="formula"></div>
  <div class="status" id="status"></div>

  <div class="collapsible" id="resultField">
    <div class="collapsible-inner">
      <label id="labelResult">result</label>
      <textarea id="resultOutput" readonly></textarea>
      <div style="margin-top:10px;">
        <button class="copy-link" onclick="copyResult()">copy</button>
      </div>
    </div>
  </div>

  <div class="note">
    decode needs the exact time value used at encoding
  </div>

</div>

<script src="cipher.js"></script>
<script>
let mode = 'encode';
let algo = 'add';

const PRECISIONS = [
  { id: 'second', parts: ['YYYY', 'MM', 'DD', 'HH', 'mm', 'ss'] },
  { id: 'minute', parts: ['YYYY', 'MM', 'DD', 'HH', 'mm'] },
  { id: 'hour',   parts: ['YYYY', 'MM', 'DD', 'HH'] },
  { id: 'day',    parts: ['YYYY', 'MM', 'DD'] },
  { id: 'month',  parts: ['YYYY', 'MM'] },
  { id: 'year',   parts: ['YYYY'] },
];

function currentTimeParts() {
  const d = new Date();
  return {
    YYYY: String(d.getFullYear()),
    MM: String(d.getMonth() + 1).padStart(2, '0'),
    DD: String(d.getDate()).padStart(2, '0'),
    HH: String(d.getHours()).padStart(2, '0'),
    mm: String(d.getMinutes()).padStart(2, '0'),
    ss: String(d.getSeconds()).padStart(2, '0'),
  };
}

function updateTimePreview() {
  const sel = document.getElementById('timePrecision');
  if (!sel) return;
  const prec = PRECISIONS.find(p => p.id === sel.value);
  const parts = currentTimeParts();
  document.getElementById('timePreview').textContent =
    prec.parts.map(k => parts[k]).join('');
}

function currentTimeKeyValue() {
  const parts = currentTimeParts();
  const pp = PRECISIONS.find(p => p.id === document.getElementById('timePrecision').value);
  return pp.parts.map(k => parts[k]).join('');
}

function updateAlgoVisibility() {
  const included = document.getElementById('passToggle').checked
    || document.getElementById('hexToggle').checked
    || document.getElementById('timeToggle').checked;
  document.getElementById('algoWrap').classList.toggle('open', included);
}

function togglePass() {
  const checked = document.getElementById('passToggle').checked;
  document.getElementById('passField').classList.toggle('open', checked);
  updateAlgoVisibility();
  updateFormula();
}

function toggleHex() {
  const checked = document.getElementById('hexToggle').checked;
  document.getElementById('colorField').classList.toggle('open', checked);
  document.getElementById('hexField').classList.toggle('open', checked);
  updateAlgoVisibility();
  updateFormula();
}

function updateTimeFields() {
  const checked = document.getElementById('timeToggle').checked;
  document.getElementById('timeField').classList.toggle('open', checked && mode === 'encode');
  document.getElementById('timeManualField').classList.toggle('open', checked && mode === 'decode');
}

function toggleTime() {
  updateTimeFields();
  if (document.getElementById('timeToggle').checked) {
    if (mode === 'encode') updateTimePreview(); else updateNowLine();
  }
  updateAlgoVisibility();
  updateFormula();
}

function currentTimeString() {
  const d = new Date();
  const p2 = (n) => String(n).padStart(2, '0');
  return String(d.getFullYear()) + p2(d.getMonth() + 1) + p2(d.getDate())
    + p2(d.getHours()) + p2(d.getMinutes()) + p2(d.getSeconds());
}

function updateNowLine() {
  const el = document.getElementById('timeNow');
  if (el) el.textContent = 'now: ' + currentTimeString();
}

function fillNow() {
  document.getElementById('timeManualInput').value = currentTimeString();
  updateFormula();
}

function setAlgo(a) {
  algo = a;
  document.getElementById('algoAdd').classList.toggle('active', a === 'add');
  document.getElementById('algoMul').classList.toggle('active', a === 'multiply');
  updateFormula();
}

document.getElementById('colorPicker').addEventListener('input', (e) => {
  document.getElementById('hexInput').value = e.target.value;
});

document.getElementById('hexInput').addEventListener('input', (e) => {
  const v = e.target.value.trim();
  if (/^#[0-9a-fA-F]{6}$/.test(v)) {
    document.getElementById('colorPicker').value = v;
  }
});

document.getElementById('timePrecision').addEventListener('change', updateTimePreview);
document.getElementById('timeManualInput').addEventListener('input', updateFormula);

setInterval(updateTimePreview, 1000);
setInterval(updateNowLine, 1000);
updateNowLine();

function switchMode(m) {
  mode = m;
  document.getElementById('btnEncode').classList.toggle('active', m === 'encode');
  document.getElementById('btnDecode').classList.toggle('active', m === 'decode');
  document.getElementById('labelText').textContent = m === 'encode' ? 'text' : 'cipher text';
  document.getElementById('goBtn').textContent = m;
  updateTimeFields();
  document.getElementById('resultField').classList.remove('open');
  document.getElementById('status').textContent = '';
  updateFormula();
}

function copyResult() {
  const el = document.getElementById('resultOutput');
  el.select();
  navigator.clipboard.writeText(el.value).catch(() => document.execCommand('copy'));
}

function run() {
  const text = document.getElementById('textInput').value;
  const passIncluded = document.getElementById('passToggle').checked;
  const hexIncluded = document.getElementById('hexToggle').checked;
  const timeIncluded = document.getElementById('timeToggle').checked;
  const passphrase = passIncluded ? document.getElementById('pwInput').value : null;
  const hexKey = hexIncluded ? document.getElementById('hexInput').value : null;
  const timePrecision = (timeIncluded && mode === 'encode') ? document.getElementById('timePrecision').value : null;
  const timeStr = (timeIncluded && mode === 'decode') ? document.getElementById('timeManualInput').value.trim() : null;
  const statusEl = document.getElementById('status');
  document.getElementById('resultField').classList.remove('open');

  statusEl.className = 'status';
  if (!text) { statusEl.textContent = 'enter some text'; statusEl.className = 'status error'; return; }
  if (!passIncluded && !hexIncluded && !timeIncluded) {
    statusEl.textContent = 'include at least a password, a hex key, or the time';
    statusEl.className = 'status error';
    return;
  }
  if (passIncluded && !passphrase) { statusEl.textContent = 'enter a passphrase'; statusEl.className = 'status error'; return; }
  if (hexIncluded && !hexKey) { statusEl.textContent = 'pick a color'; statusEl.className = 'status error'; return; }
  if (timeIncluded && mode === 'decode' && !timeStr) { statusEl.textContent = 'enter the time value'; statusEl.className = 'status error'; return; }

  try {
    const result = mode === 'encode'
      ? encodeCipher(passphrase, hexKey, timePrecision, text, algo)
      : decodeCipher(passphrase, hexKey, timeStr, text, algo);
    document.getElementById('resultOutput').value = result;
    document.getElementById('resultField').classList.add('open');
    statusEl.textContent = '';
  } catch (err) {
    statusEl.textContent = err.message;
    statusEl.className = 'status error';
  }
}

function updateFormula() {
  const passIncluded = document.getElementById('passToggle').checked;
  const hexIncluded = document.getElementById('hexToggle').checked;
  const timeIncluded = document.getElementById('timeToggle').checked;
  const opSymbol = algo === 'multiply' ? '\u00d7' : '+';

  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const terms = [];
  if (passIncluded) terms.push('<span class="key-term">password</span>');
  if (hexIncluded) terms.push('<span class="key-term">hex</span>');
  if (timeIncluded) {
    let t = '<span class="key-term">time</span>';
    const tv = mode === 'encode'
      ? currentTimeKeyValue()
      : document.getElementById('timeManualInput').value.trim();
    if (tv) t += '<span class="time-inline"> (' + esc(tv) + ')</span>';
    terms.push(t);
  }

  const formulaEl = document.getElementById('formula');
  if (terms.length === 0) {
    formulaEl.innerHTML = mode === 'encode'
      ? 'encoded = ascii(text)'
      : 'text = ascii<sup>-1</sup>(encoded)';
    return;
  }

  const keyExpr = '(' + terms.join(' ' + opSymbol + ' ') + ')';
  formulaEl.innerHTML = mode === 'encode'
    ? 'encoded = ascii(text) + ' + keyExpr
    : 'text = ascii<sup>-1</sup>(encoded &minus; ' + keyExpr + ')';
}

function updateTimeFormulaTick() {
  if (document.getElementById('timeToggle').checked) updateFormula();
}
setInterval(updateTimeFormulaTick, 1000);

updateFormula();
</script>
</body>
</html>
